# Built-in tool profiles (design 8.2). Memory figures include allocations
# outside the private range, such as GPU memory, and are starting points:
# measured history replaces them after the first runs (design 8.3).
# Files in the data directory's profiles.d/ add profiles or replace these by
# name.

# Shell builtins and small utilities --------------------------------------

[[profile]]
name = "shell-builtin"
program = [":", "true", "false", "cd", "pwd", "echo", "printf", "export", "unset", "set", "wait", "exit", "test", "[", "type", "hash", "alias", "shift", "return"]
class = "light"
writes = "none"

[[profile]]
name = "info"
program = ["which", "whoami", "id", "uname", "hostname", "date", "basename", "dirname", "realpath", "readlink", "printenv", "env", "sleep", "tty", "nproc", "sw_vers", "locale", "arch"]
class = "light"
writes = "none"

[[profile]]
name = "command-lookup"
program = ["command"]
args_any = ["-v", "-V"]
class = "light"
writes = "none"

[[profile]]
name = "ls"
program = ["ls"]
args_none = ["-R", "--recursive"]
class = "light"
writes = "none"

[[profile]]
name = "ls-recursive"
program = ["ls"]
args_any = ["-R", "--recursive"]
class = "medium"
writes = "none"

[[profile]]
name = "read-file"
program = ["cat", "head", "wc", "stat", "file", "md5", "shasum", "sha256sum", "jq", "diff", "cmp", "sort", "uniq", "cut", "tr", "column", "nl"]
class = "light"
max_input = "16M"
writes = "none"

[[profile]]
name = "tail"
program = ["tail"]
args_none = ["-f", "-F", "--follow"]
class = "light"
max_input = "16M"
writes = "none"

[[profile]]
name = "tail-follow"
program = ["tail"]
args_any = ["-f", "-F", "--follow"]
class = "light"
writes = "none"
interactive = true

[[profile]]
name = "search"
program = ["grep", "egrep", "rg", "ag", "find", "fd", "du", "tree", "sed", "awk"]
class = "medium"
writes = "none"

[[profile]]
name = "file-change"
program = ["mkdir", "touch", "rm", "rmdir", "cp", "mv", "ln", "chmod", "chown", "tee", "install"]
class = "light"
writes = "args"

[[profile]]
name = "archive"
program = ["tar", "zip", "unzip", "gzip", "gunzip", "xz", "zstd"]
class = "medium"

[[profile]]
name = "network-fetch"
program = ["curl", "wget"]
class = "light"
writes = "none"

[[profile]]
name = "interactive"
program = ["less", "more", "man", "top", "htop", "btop", "ssh", "tmux", "screen", "watch"]
class = "light"
writes = "none"
interactive = true

[[profile]]
name = "editor"
program = ["vim", "vi", "nvim", "nano", "emacs"]
class = "light"
writes = "args"
interactive = true

# Git ---------------------------------------------------------------------

[[profile]]
name = "git-light"
program = ["git"]
value_flags = ["-C", "-c", "--git-dir", "--work-tree"]
subcommand = ["rev-parse", "config", "remote", "symbolic-ref", "ls-remote", "version"]
class = "light"
writes = "none"

[[profile]]
name = "git-read"
program = ["git"]
value_flags = ["-C", "-c", "--git-dir", "--work-tree"]
subcommand = ["status", "log", "diff", "show", "branch", "blame", "ls-files", "grep", "describe", "shortlog", "reflog", "worktree list"]
class = "medium"
writes = "none"

[[profile]]
name = "git-write"
program = ["git"]
value_flags = ["-C", "-c", "--git-dir", "--work-tree"]
subcommand = ["add", "commit", "checkout", "switch", "restore", "reset", "merge", "rebase", "cherry-pick", "revert", "stash", "tag", "mv", "rm", "clean", "apply", "am", "worktree add", "worktree remove"]
class = "medium"
writes = "project"

[[profile]]
name = "git-interactive"
program = ["git"]
value_flags = ["-C", "-c", "--git-dir", "--work-tree"]
subcommand = ["rebase", "add", "commit"]
args_any = ["-i", "--interactive", "-p", "--patch"]
class = "light"
writes = "project"
interactive = true

[[profile]]
name = "git-network"
program = ["git"]
value_flags = ["-C", "-c", "--git-dir", "--work-tree"]
subcommand = ["clone", "fetch", "pull", "push", "submodule", "lfs"]
class = "medium"
writes = "project"

# Rust --------------------------------------------------------------------

[[profile]]
name = "cargo-build"
program = ["cargo"]
value_flags = ["-Z", "--config", "--color"]
subcommand = ["build", "b", "run", "r", "install", "doc", "bench"]
class = "heavy"
writes = "paths"
write_paths = ["target"]
mem = "3G"
parallelism = { env = ["CARGO_BUILD_JOBS"], flag = "-j", jobserver = true }

[[profile]]
name = "cargo-test"
program = ["cargo"]
value_flags = ["-Z", "--config", "--color"]
subcommand = ["test", "t", "nextest"]
class = "heavy"
writes = "paths"
write_paths = ["target"]
mem = "4G"
parallelism = { env = ["CARGO_BUILD_JOBS", "RUST_TEST_THREADS"], flag = "-j", jobserver = true }

[[profile]]
name = "cargo-check"
program = ["cargo"]
value_flags = ["-Z", "--config", "--color"]
subcommand = ["check", "c", "clippy"]
class = "heavy"
writes = "paths"
write_paths = ["target"]
mem = "2G"
parallelism = { env = ["CARGO_BUILD_JOBS"], flag = "-j", jobserver = true }

[[profile]]
name = "cargo-fmt"
program = ["cargo"]
subcommand = ["fmt"]
class = "light"
writes = "project"

[[profile]]
name = "cargo-deps"
program = ["cargo"]
subcommand = ["fetch", "update", "add", "remove", "generate-lockfile"]
class = "medium"
writes = "project"

[[profile]]
name = "cargo-info"
program = ["cargo"]
subcommand = ["metadata", "tree", "version", "pkgid", "locate-project"]
class = "light"
writes = "none"

[[profile]]
name = "rustc"
program = ["rustc"]
class = "heavy"
mem = "1G"

# C, C++, Swift, Apple ----------------------------------------------------

[[profile]]
name = "make"
program = ["make", "gmake"]
class = "heavy"
writes = "project"
mem = "2G"
parallelism = { flag = "-j", jobserver = true }

[[profile]]
name = "ninja"
program = ["ninja"]
class = "heavy"
writes = "project"
mem = "2G"
parallelism = { flag = "-j", jobserver = true }

[[profile]]
name = "cmake-build"
program = ["cmake"]
args_any = ["--build"]
class = "heavy"
writes = "project"
mem = "2G"
parallelism = { env = ["CMAKE_BUILD_PARALLEL_LEVEL"], flag = "-j" }

[[profile]]
name = "cmake-configure"
program = ["cmake"]
args_none = ["--build"]
class = "medium"
writes = "project"

[[profile]]
name = "cc"
program = ["cc", "gcc", "g++", "clang", "clang++"]
class = "medium"
mem = "1G"

[[profile]]
name = "xcodebuild"
program = ["xcodebuild"]
class = "heavy"
writes = "project"
mem = "6G"
parallelism = { flag = "-jobs" }

[[profile]]
name = "swift-build"
program = ["swift"]
subcommand = ["build", "test", "run"]
class = "heavy"
writes = "paths"
write_paths = [".build"]
mem = "3G"
parallelism = { flag = "-j" }

# Go ----------------------------------------------------------------------

[[profile]]
name = "go-build"
program = ["go"]
subcommand = ["build", "run", "install", "vet", "generate"]
class = "heavy"
writes = "project"
mem = "2G"
parallelism = { env = ["GOMAXPROCS"], flag = "-p" }

[[profile]]
name = "go-test"
program = ["go"]
subcommand = ["test"]
class = "heavy"
mem = "2G"
parallelism = { env = ["GOMAXPROCS"], flag = "-p" }

[[profile]]
name = "go-mod"
program = ["go"]
subcommand = ["mod download", "mod tidy", "get"]
class = "medium"
writes = "project"

# JavaScript and TypeScript -----------------------------------------------

[[profile]]
name = "js-install"
program = ["npm", "pnpm", "yarn", "bun"]
subcommand = ["install", "i", "ci", "add", "update", "upgrade"]
class = "heavy"
writes = "paths"
write_paths = ["node_modules", "package-lock.json", "pnpm-lock.yaml", "yarn.lock"]
mem = "2G"

[[profile]]
name = "tsc"
program = ["tsc", "vue-tsc"]
class = "heavy"
writes = "project"
mem = "2G"

[[profile]]
name = "js-test"
program = ["jest", "vitest", "mocha", "playwright"]
class = "heavy"
mem = "3G"
parallelism = { flag = "--max-workers" }

[[profile]]
name = "js-bundle"
program = ["webpack", "vite", "rollup", "esbuild", "next", "nuxt", "turbo", "nx"]
class = "heavy"
writes = "project"
mem = "3G"

[[profile]]
name = "js-lint"
program = ["eslint", "prettier", "biome", "stylelint"]
class = "medium"
mem = "1G"

[[profile]]
name = "node-repl"
program = ["node", "deno", "bun"]
class = "medium"
interactive_without_args = true
mem = "512M"

[[profile]]
name = "metro"
program = ["react-native"]
subcommand = ["start", "run-android", "run-ios", "bundle"]
class = "heavy"
mem = "3G"

# Python ------------------------------------------------------------------

[[profile]]
name = "pytest"
program = ["pytest", "py.test", "tox", "nox"]
class = "heavy"
mem = "1G"
parallelism = { flag = "-n" }

[[profile]]
name = "python-pytest"
program = ["python", "python3"]
args_any = ["pytest"]
class = "heavy"
mem = "1G"

[[profile]]
name = "python-repl"
program = ["python", "python3", "ipython"]
class = "medium"
interactive_without_args = true
mem = "512M"

[[profile]]
name = "python-install"
program = ["pip", "pip3", "uv", "poetry", "pipx", "conda", "mamba"]
subcommand = ["install", "sync", "add", "lock", "update", "pip install", "pip sync", "create"]

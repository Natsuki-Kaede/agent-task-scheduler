openapi: 3.1.0
info:
  title: ats daemon API
  version: 0.1.0
  description: |
    API of the Agent Task Scheduler daemon. The CLI, executors and hooks reach
    it over a unix socket in the data directory; clients that cannot reach the
    socket use the request-file channel, which carries the same requests.

paths:
  /v1/health:
    get:
      summary: Daemon identity
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  version: { type: string }
                  pid: { type: integer }
                  started_at: { type: string, format: date-time }
                  instance: { type: string, description: Changes every time the daemon starts }

  /v1/jobs:
    get:
      summary: List jobs, newest first
      parameters:
        - { name: state, in: query, schema: { type: string }, description: Comma-separated job states }
        - { name: limit, in: query, schema: { type: integer, default: 100, maximum: 1000 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Job' } }
    post:
      summary: Register a submission with a new job
      description: |
        The daemon recognizes the command, predicts its resources, derives
        its locks and records its predecessors, all committed with the
        submission before it answers. `now` is refused (409) when a
        predecessor has not succeeded or a lock is held; the error names
        each conflict. A bad hint or predecessor gets 400, and an unknown
        field 422.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmitRequest' }
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Created' }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /v1/submissions/{id}:
    get:
      summary: One submission and its job's state
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Submission' }
        '404': { $ref: '#/components/responses/Error' }

  /v1/jobs/{id}:
    get:
      summary: One job
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '404': { $ref: '#/components/responses/Error' }

  /v1/jobs/{id}/executor:
    post:
      summary: Register the job's executor (process id and start time)
      description: |
        The submitting CLI registers the executor right after starting it, and
        the executor registers itself again; repeating the same process is
        accepted. A different process, or a job that has ended, gets 409.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pid, start]
              properties:
                pid: { type: integer }
                start: { type: string, description: Process start time as reported by the OS }
      responses:
        '204': { description: Recorded }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /v1/jobs/{id}/lease:
    post:
      summary: Executor asks whether the job is admitted
      description: |
        The scheduler admits jobs and commits their lease and reservation
        before this answers `granted: true`; asking again after a lost
        answer gets the same answer. The request waits up to 3 seconds for
        a decision, then answers `granted: false`, and the executor asks
        again. A job that ended before it started (for example, canceled)
        gets 409.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pid]
              properties:
                pid: { type: integer, description: The registered executor }
      responses:
        '200':
          description: Granted, or not yet. A grant carries the leased parallelism, the jobserver tokens to pool (for lines running jobserver clients) and the variables to set to the parallelism.
          content:
            application/json:
              schema:
                type: object
                properties:
                  granted: { type: boolean }
                  parallelism: { type: [integer, 'null'] }
                  jobserver_tokens: { type: [integer, 'null'] }
                  env: { type: array, items: { type: string } }
        '404': { $ref: '#/components/responses/Error' }
        '409':
          description: The job ended before it started (for example, canceled), or the caller is not its executor
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }

  /v1/jobs/{id}/started:
    post:
      summary: Executor started the command
      parameters:
        - { $ref: '#/components/parameters/Id' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [log_path]
              properties:
                log_path: { type: string, description: Directory holding stdout.log and stderr.log }
                pgid: { type: integer, description: Process group of the command }
      responses:
        '204': { description: Recorded }
        '404': { $ref: '#/components/responses/Error' }

  /v1/jobs/{id}/main-result:
    post:
      summary: The main execution process exited and both output streams ended
      parameters:
        - { $ref: '#/components/parameters/Id' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [exit_code]
              properties:
                exit_code: { type: integer, description: 128 + signal number when killed by a signal }
      responses:
        '204': { description: Recorded }
        '404': { $ref: '#/components/responses/Error' }

  /v1/jobs/{id}/finished:
    post:
      summary: The job reached a terminal state
      description: Repeating the same terminal state is accepted; a different one gets 409.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state]
              properties:
                state: { $ref: '#/components/schemas/JobState' }
                exit_code: { type: [integer, 'null'] }
                max_rss: { type: integer, description: Largest resident size of any process the command waited for, in bytes; used only when sampling saw nothing }
      responses:
        '204': { description: Recorded }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /v1/jobs/{id}/control:
    get:
      summary: What the executor should do now
      description: Executors poll this; a poll also counts as reconnecting after a daemon restart.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  cancel: { type: boolean, description: Every submission of the job is canceled }

  /v1/submissions/{id}/wait:
    post:
      summary: Wait for a submission's job, up to a time limit
      description: |
        Waits until the condition holds or the time runs out (counted with
        system sleep) and answers either way. "main": the main execution
        process result is in, or the job ended. "terminal": the job ended.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [until]
              properties:
                until: { type: string, enum: [main, terminal] }
                wait_seconds: { type: number, description: Absent waits without limit }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  reached: { type: boolean }
                  submission: { $ref: '#/components/schemas/Submission' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /v1/submissions/{id}/cancel:
    post:
      summary: Cancel a submission
      description: The job stops once none of its submissions is left uncanceled.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '204': { description: Recorded }
        '404': { $ref: '#/components/responses/Error' }

  /v1/submissions/{id}/quiet:
    post:
      summary: Do not report a submission's end
      description: Set by the CLI once the submission's result has reached the agent.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '204': { description: Recorded }
        '404': { $ref: '#/components/responses/Error' }

  /v1/submissions/{id}/detach:
    post:
      summary: Let the agent stop without waiting for a submission
      description: The Stop reminder leaves it out; its end is still reported once.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '204': { description: Recorded }
        '404': { $ref: '#/components/responses/Error' }

  /v1/sessions/{id}/running:
    get:
      summary: A session's submissions still running and not detached, for the Stop reminder
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Reminder' } }

  /v1/sessions/{id}/ended:
    post:
      summary: A session's ended submissions not yet reported, for the UserPromptSubmit reminder
      description: The submissions returned become quiet, so each is reported once.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Reminder' } }

  /v1/jobs/{id}/why:
    get:
      summary: Why a job is where it is
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: The job's state and, while it waits, the scheduler's latest verdict
          content:
            application/json:
              schema:
                type: object
                properties:
                  job: { type: string }
                  state: { $ref: '#/components/schemas/JobState' }
                  verdict: { oneOf: [{ $ref: '#/components/schemas/Verdict' }, { type: 'null' }] }
        '404': { $ref: '#/components/responses/Error' }

  /v1/jobs/{id}/unblock:
    post:
      summary: Run a job whose predecessor failed
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '204': { description: Queued again }
        '404': { $ref: '#/components/responses/Error' }

  /v1/pressure:
    get:
      summary: Memory pressure and where memory goes
      description: |
        Pressure is up while the swap-out rate, averaged over 10 seconds, is
        at or above 4 MiB a second or the system reports critical pressure,
        and for 30 seconds after. While it is up nothing new is admitted, and
        on macOS running jobs are on background QoS.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  pressured: { type: boolean }
                  swap_out_rate: { type: number, description: Bytes per second, averaged over 10 seconds }
                  system_level: { type: integer, description: '1 normal, 2 warning (macOS only), 4 critical' }
                  managed: { type: integer, description: Private memory resident in managed jobs, in bytes }
                  unmanaged: { type: integer, description: Memory in use by everything else, in bytes }

  /v1/measurements:
    get:
      summary: The latest resource measurements
      description: System memory and pressure, and each job's private memory, sampled every second.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Measurements' }

components:
  parameters:
    Id:
      { name: id, in: path, required: true, schema: { type: string } }

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }

  schemas:
    ErrorBody:
      type: object
      properties:
        error: { type: string }

    JobState:
      type: string
      enum: [queued, blocked, capacity_insufficient, admitted, running, awaiting_takeover, completed, start_failed, canceled, ended_unknown]

    SubmitRequest:
      type: object
      required: [entry, cwd]
      properties:
        entry: { type: string, enum: [argv, sh] }
        argv: { type: array, items: { type: string }, description: Required for entry argv }
        source: { type: string, description: Shell source, required for entry sh }
        cwd: { type: string }
        session: { type: string, description: "The agent session, from the environment the agent sets" }
        launcher_pid: { type: integer, description: The submitting CLI, which starts the executor }
        launcher_start: { type: string, description: Start time of the submitting CLI }
        after: { type: array, items: { type: string }, description: Job or submission ids that must succeed first }
        now: { type: boolean, default: false, description: Skip the queue unless a dependency or lock conflicts }
        lock: { type: array, items: { type: string }, description: Extra paths or named resources to lock }
        hint: { type: string, description: 'Expected memory such as mem=6G; used where higher than predicted' }
      additionalProperties: false

    Created:
      type: object
      properties:
        submission: { type: string }
        job: { type: string }

    Job:
      type: object
      properties:
        id: { type: string }
        state: { $ref: '#/components/schemas/JobState' }
        entry: { type: string, enum: [argv, sh] }
        command: { type: string, description: Display form with secret-looking values redacted }
        cwd: { type: string }
        project_root: { type: string }
        exit_code: { type: [integer, 'null'] }
        main_exit_code: { type: [integer, 'null'] }
        log_path: { type: [string, 'null'] }
        executor_pid: { type: [integer, 'null'] }
        peak_private: { type: [integer, 'null'], description: Peak private memory in bytes }
        submissions: { type: integer }
        created_at: { type: string, format: date-time }
        started_at: { type: [string, 'null'], format: date-time }
        ended_at: { type: [string, 'null'], format: date-time }

    Verdict:
      type: object
      description: |
        verdict is admit, wait (with a reason), blocked (with the failed
        predecessor `job`) or capacity_insufficient (with `need` and
        `budget` in bytes). Wait reasons: recovering, pressure,
        no_executor, dependency (job), lock (resource, holder), memory
        (need, free), behind (head).
      properties:
        verdict: { type: string, enum: [admit, wait, blocked, capacity_insufficient] }
        reason:
          type: object
          properties:
            kind: { type: string }
        job: { type: string }
        need: { type: integer }
        budget: { type: integer }

    JobUsage:
      type: object
      properties:
        processes: { type: array, items: { type: integer } }
        private_resident: { type: integer, description: Private memory resident now, in bytes }
        private_total: { type: integer, description: Private memory including compressed and swapped-out parts }
        peak_private_total: { type: integer }

    Measurements:
      type: object
      properties:
        at: { type: string, format: date-time }
        system:
          type: [object, 'null']
          properties:
            mem_total: { type: integer }
            mem_used: { type: integer }
            pressure: { type: integer, description: '1 normal, 2 warning (macOS only), 4 critical' }
            swap_out_bytes: { type: integer, description: Bytes swapped out since boot }
            cores: { type: integer }
        swap_out_rate: { type: number, description: Bytes swapped out per second since the previous sample }
        jobs: { type: object, additionalProperties: { $ref: '#/components/schemas/JobUsage' } }

    Reminder:
      type: object
      properties:
        submission: { type: string }
        job: { type: string }
        state: { $ref: '#/components/schemas/JobState' }
        exit_code: { type: [integer, 'null'] }
        command: { type: string }

    Submission:
      type: object
      properties:
        id: { type: string }
        job: { type: string }
        job_state: { $ref: '#/components/schemas/JobState' }
        session_id: { type: [string, 'null'] }
        exit_code: { type: [integer, 'null'] }
        main_exit_code: { type: [integer, 'null'] }
        log_path: { type: [string, 'null'] }
        canceled: { type: boolean }
        detached: { type: boolean, description: The Stop reminder leaves it out }
        quiet: { type: boolean, description: Its end is not reported }

openapi: 3.1.0
info:
  title: ats daemon API
  version: 0.1.0
  description: |
    API of the Agent Task Scheduler daemon. The CLI, executors and hooks reach
    it over a unix socket in the data directory; clients that cannot reach the
    socket use the request-file channel, which carries the same requests.
    Endpoints are added as the corresponding features land.

paths:
  /v1/health:
    get:
      summary: Daemon identity
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  version: { type: string }
                  pid: { type: integer }
                  started_at: { type: string, format: date-time }
                  instance: { type: string, description: Changes every time the daemon starts }

  /v1/jobs:
    get:
      summary: List jobs, newest first
      parameters:
        - { name: state, in: query, schema: { type: string }, description: Comma-separated job states }
        - { name: limit, in: query, schema: { type: integer, default: 100, maximum: 1000 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Job' } }
    post:
      summary: Register a submission with a new job
      description: |
        The daemon recognizes the command, predicts its resources, derives
        its locks and records its predecessors, all committed with the
        submission before it answers. Repeating a request_id with the same
        command returns the earlier submission (200); with a different
        command it is rejected (409). `now` is refused (409) when a
        predecessor has not succeeded or a lock is held; the error names
        each conflict. A bad hint, urgency or predecessor gets 400.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmitRequest' }
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Created' }
        '200':
          description: The request id was already registered with this command
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Created' }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /v1/submissions/{id}:
    get:
      summary: One submission and its job's state
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Submission' }
        '404': { $ref: '#/components/responses/Error' }

  /v1/jobs/{id}:
    get:
      summary: One job
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '404': { $ref: '#/components/responses/Error' }

  /v1/jobs/{id}/executor:
    post:
      summary: Register the job's executor (process id and start time)
      description: |
        The submitting CLI registers the executor right after starting it, and
        the executor registers itself again; repeating the same process is
        accepted. A different process, or a job that has ended, gets 409.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pid, start]
              properties:
                pid: { type: integer }
                start: { type: string, description: Process start time as reported by the OS }
      responses:
        '204': { description: Recorded }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /v1/jobs/{id}/lease:
    post:
      summary: Executor asks whether the job is admitted
      description: |
        The scheduler admits jobs and commits their lease and reservation
        before this answers `granted: true`; asking again after a lost
        answer gets the same answer. The request waits up to 3 seconds for
        a decision, then answers `granted: false`, and the executor asks
        again. A job that ended before it started (for example, canceled)
        gets 409.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pid]
              properties:
                pid: { type: integer, description: The registered executor }
      responses:
        '200':
          description: Granted, or not yet
          content:
            application/json:
              schema:
                type: object
                properties:
                  granted: { type: boolean }
        '404': { $ref: '#/components/responses/Error' }
        '409':
          description: The job ended before it started (for example, canceled), or the caller is not its executor
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }

  /v1/jobs/{id}/started:
    post:
      summary: Executor started the command
      parameters:
        - { $ref: '#/components/parameters/Id' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [log_path]
              properties:
                log_path: { type: string, description: Directory holding stdout.log and stderr.log }
                pgid: { type: integer, description: Process group of the command }
      responses:
        '204': { description: Recorded }
        '404': { $ref: '#/components/responses/Error' }

  /v1/jobs/{id}/main-result:
    post:
      summary: The main execution process exited and both output streams ended
      parameters:
        - { $ref: '#/components/parameters/Id' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [exit_code]
              properties:
                exit_code: { type: integer, description: 128 + signal number when killed by a signal }
      responses:
        '204': { description: Recorded }
        '404': { $ref: '#/components/responses/Error' }

  /v1/jobs/{id}/finished:
    post:
      summary: The job reached a terminal state
      description: Repeating the same terminal state is accepted; a different one gets 409.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state]
              properties:
                state: { $ref: '#/components/schemas/JobState' }
                exit_code: { type: [integer, 'null'] }
                cpu_seconds: { type: number, description: CPU time of every process the command waited for }
                max_rss: { type: integer, description: Largest resident size of any one of them, in bytes; used only when sampling saw nothing }
      responses:
        '204': { description: Recorded }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /v1/jobs/{id}/control:
    get:
      summary: What the executor should do now
      description: Executors poll this; a poll also counts as reconnecting after a daemon restart.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  cancel: { type: boolean, description: Every submission of the job is canceled }

  /v1/submissions/{id}/wait:
    post:
      summary: Wait for a submission's job, up to a time limit
      description: |
        Waits until the condition holds or the time runs out (counted with
        system sleep) and answers either way. "main": the main execution
        process result is in, or the job ended. "terminal": the job ended.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [until]
              properties:
                until: { type: string, enum: [main, terminal] }
                wait_seconds: { type: number, description: Absent waits without limit }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  reached: { type: boolean }
                  submission: { $ref: '#/components/schemas/Submission' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /v1/submissions/{id}/cancel:
    post:
      summary: Cancel a submission
      description: The job stops once none of its submissions is left uncanceled.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '204': { description: Recorded }
        '404': { $ref: '#/components/responses/Error' }

  /v1/submissions/{id}/detach:
    post:
      summary: Mark a submission as left to run in the background
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '204': { description: Recorded }
        '404': { $ref: '#/components/responses/Error' }

  /v1/submissions/{id}/retrieved:
    post:
      summary: Record that the submission's terminal state reached its caller
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '204': { description: Recorded }
        '404': { $ref: '#/components/responses/Error' }
        '409':
          description: The job is not in a terminal state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }

  /v1/jobs/{id}/why:
    get:
      summary: Why a job is where it is
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: The job's state and, while it waits, the scheduler's latest verdict
          content:
            application/json:
              schema:
                type: object
                properties:
                  job: { type: string }
                  state: { $ref: '#/components/schemas/JobState' }
                  verdict: { oneOf: [{ $ref: '#/components/schemas/Verdict' }, { type: 'null' }] }
        '404': { $ref: '#/components/responses/Error' }

  /v1/jobs/{id}/unblock:
    post:
      summary: Run a job whose predecessor failed
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '204': { description: Queued again }
        '404': { $ref: '#/components/responses/Error' }

  /v1/jobs/{id}/pin:
    post:
      summary: Set or clear a job's manual queue position
      parameters:
        - { $ref: '#/components/parameters/Id' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rank: { type: [integer, 'null'], description: Lower runs first; null unpins }
      responses:
        '204': { description: Recorded }
        '404': { $ref: '#/components/responses/Error' }

  /v1/measurements:
    get:
      summary: The latest resource measurements
      description: System memory and pressure, and per-job and shared-daemon usage, sampled every second.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Measurements' }

  /v1/requests/{id}:
    get:
      summary: The submission registered under a caller's request id
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Submission' }
        '404': { $ref: '#/components/responses/Error' }

components:
  parameters:
    Id:
      { name: id, in: path, required: true, schema: { type: string } }

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }

  schemas:
    ErrorBody:
      type: object
      properties:
        error: { type: string }

    JobState:
      type: string
      enum: [queued, blocked, capacity_insufficient, admitted, running, throttled, frozen, awaiting_takeover, completed, start_failed, canceled, replaced, externally_terminated, ended_unknown]

    SubmitRequest:
      type: object
      required: [entry, cwd]
      properties:
        entry: { type: string, enum: [argv, sh] }
        argv: { type: array, items: { type: string }, description: Required for entry argv }
        source: { type: string, description: Shell source, required for entry sh }
        shell: { type: string, description: The submitter's shell for entry sh }
        cwd: { type: string }
        session: { type: string }
        agent: { type: string }
        invocation_key: { type: string }
        request_id: { type: string }
        sandbox_signature: { type: string }
        service: { type: boolean, default: false }
        launcher_pid: { type: integer, description: The submitting CLI, which starts the executor }
        launcher_start: { type: string, description: Start time of the submitting CLI }
        after: { type: array, items: { type: string }, description: Job or submission ids that must succeed first }
        now: { type: boolean, default: false, description: Skip the queue unless a dependency or lock conflicts }
        lock: { type: array, items: { type: string }, description: Extra paths or named resources to lock }
        hint: { type: string, description: 'Expected use such as mem=6G,cpu=4; used where higher than predicted' }
        urgency: { type: string, enum: [low, normal, high] }
        reason: { type: string }
      additionalProperties: true

    Created:
      type: object
      properties:
        submission: { type: string }
        job: { type: string }
        state: { $ref: '#/components/schemas/JobState' }
        existing: { type: boolean }

    Job:
      type: object
      properties:
        id: { type: string }
        state: { $ref: '#/components/schemas/JobState' }
        entry: { type: string, enum: [argv, sh] }
        command: { type: string, description: Display form with secret-looking values redacted }
        cwd: { type: string }
        project_root: { type: string }
        service: { type: boolean }
        exit_code: { type: [integer, 'null'] }
        main_exit_code: { type: [integer, 'null'] }
        log_path: { type: [string, 'null'] }
        executor_pid: { type: [integer, 'null'] }
        peak_private: { type: [integer, 'null'], description: Peak private memory in bytes }
        cpu_seconds: { type: [number, 'null'] }
        submissions: { type: integer }
        created_at: { type: string, format: date-time }
        started_at: { type: [string, 'null'], format: date-time }
        ended_at: { type: [string, 'null'], format: date-time }

    Verdict:
      type: object
      description: |
        verdict is admit, wait (with a reason), blocked (with the failed
        predecessor `job`) or capacity_insufficient (with `need` and
        `budget` in bytes). Wait reasons: recovering, pressure (level),
        interval, no_executor, dependency (job), lock (resource, holder),
        memory (need, free), cpu (need, free), behind (head).
      properties:
        verdict: { type: string, enum: [admit, wait, blocked, capacity_insufficient] }
        reason:
          type: object
          properties:
            kind: { type: string }
        job: { type: string }
        need: { type: integer }
        budget: { type: integer }

    Usage:
      type: object
      properties:
        processes: { type: array, items: { type: integer } }
        cpu_cores: { type: number, description: Cores kept busy over the last second }
        cpu_seconds: { type: number }
        private_resident: { type: integer, description: Private memory resident now, in bytes }
        private_total: { type: integer, description: Private memory including compressed and swapped-out parts }
        peak_private_total: { type: integer }
        disk_read: { type: integer }
        disk_write: { type: integer }

    Measurements:
      type: object
      properties:
        at: { type: string, format: date-time }
        boot_id: { type: [string, 'null'] }
        system:
          type: [object, 'null']
          properties:
            mem_total: { type: integer }
            mem_used: { type: integer }
            compressed: { type: integer }
            swap_used: { type: integer }
            pressure: { type: integer, description: '1 normal, 2 warning, 4 critical' }
            page_ins: { type: integer }
            page_outs: { type: integer }
            swap_ins: { type: integer }
            swap_outs: { type: integer }
            compressions: { type: integer }
            decompressions: { type: integer }
            perf_cores: { type: integer }
            efficiency_cores: { type: integer }
        rates:
          type: object
          description: Per-second rates of the system counters
          additionalProperties: { type: number }
        jobs: { type: object, additionalProperties: { $ref: '#/components/schemas/Usage' } }
        shared: { type: object, additionalProperties: { $ref: '#/components/schemas/Usage' } }
        last_sleep:
          type: [object, 'null']
          properties:
            at: { type: string, format: date-time }
            seconds: { type: number }

    Submission:
      type: object
      properties:
        id: { type: string }
        job: { type: string }
        job_state: { $ref: '#/components/schemas/JobState' }
        session_id: { type: [string, 'null'] }
        agent: { type: [string, 'null'] }
        request_id: { type: [string, 'null'] }
        exit_code: { type: [integer, 'null'] }
        main_exit_code: { type: [integer, 'null'] }
        log_path: { type: [string, 'null'] }
        canceled: { type: boolean }
        detached: { type: boolean }
        final_retrieved: { type: boolean }

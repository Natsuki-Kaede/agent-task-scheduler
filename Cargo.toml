[package]
name = "agent-task-scheduler"
version = "0.1.1"
edition = "2024"
description = "Local scheduler that queues resource-heavy commands from AI agents and admits them by machine capacity"
license = "GPL-3.0-only"
repository = "https://github.com/Natsuki-Kaede/agent-task-scheduler"

[[bin]]
name = "ats"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["tokio", "http1", "json", "query"] }
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
http-body-util = "0.1.5"
humantime = "2.4.0"
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
libc = "0.2.191"
rand = "0.10.3"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
shlex = "2.0.1"
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "net", "fs", "signal", "process", "time", "sync", "io-util"] }
toml = "1.1.8"
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
tempfile = "3.27.0"
